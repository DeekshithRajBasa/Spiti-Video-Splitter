name: Desktop apps

# Builds the Windows installer and the macOS disk images.
# - Every push to main (and the claude/* working branches) uploads them as workflow artifacts.
# - Pushing a tag like v1.0.0 also publishes them on a GitHub Release.
# - Or run it manually (Actions → Desktop apps → Run workflow) with a release tag:
#   the workflow creates the tag on the chosen branch and publishes the Release.
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this tag (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # No signing certificates configured: build unsigned (macOS gets an ad-hoc signature).
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx vite build
      - name: Build Apple Silicon (arm64)
        run: npx electron-builder --mac --arm64 --publish never
      - name: Swap in the Intel FFmpeg binary
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg
      - name: Build Intel (x64)
        run: npx electron-builder --mac --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Spiti Video Splitter ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
